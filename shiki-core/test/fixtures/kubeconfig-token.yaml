apiVersion: v1
kind: Config
current-context: tok
clusters:
  - name: tok-cluster
    cluster:
      server: https://10.0.0.1
      certificate-authority-data: QkFTRTY0Q0E=
contexts:
  - name: tok
    context:
      cluster: tok-cluster
      user: tok-user
users:
  - name: tok-user
    user:
      token: a-static-bearer-token
