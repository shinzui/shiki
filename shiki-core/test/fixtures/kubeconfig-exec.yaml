apiVersion: v1
kind: Config
current-context: gke
clusters:
  - name: gke-cluster
    cluster:
      server: https://34.x.y.z
      certificate-authority-data: QkFTRTY0Q0E=
contexts:
  - name: gke
    context:
      cluster: gke-cluster
      user: gke-user
users:
  - name: gke-user
    user:
      exec:
        apiVersion: client.authentication.k8s.io/v1beta1
        command: gke-gcloud-auth-plugin
        args: null
        env: null
        provideClusterInfo: true
        interactiveMode: IfAvailable
